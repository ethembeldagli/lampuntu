name: Build Lampuntu Live ISO

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            debootstrap \
            squashfs-tools \
            xorriso \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools \
            vorbis-tools \
            pulseaudio-utils \
            alsa-utils

      - name: Locate and Set Executable Permissions
        run: |
          # Find all shell scripts in the repository and grant execute permissions
          find . -maxdepth 2 -type f -name "*.sh" -exec chmod +x {} +
          ls -la

      - name: Build Lampuntu ISO
        run: |
          # Locate build.sh even if nested in a subdirectory
          BUILD_SCRIPT=$(find . -maxdepth 2 -type f -name "build.sh" | head -n 1)
          if [ -z "$BUILD_SCRIPT" ]; then
            echo "Error: build.sh not found!"
            exit 1
          fi
          
          BUILD_DIR=$(dirname "$BUILD_SCRIPT")
          cd "$BUILD_DIR"
          sudo ./build.sh -

      - name: Locate Generated ISO File
        id: find_iso
        run: |
          ISO_FILE=$(find . -type f -name "*.iso" | head -n 1)
          if [ -z "$ISO_FILE" ]; then
            echo "Error: No ISO file generated!"
            exit 1
          fi
          echo "Found ISO: $ISO_FILE"
          echo "iso_path=$ISO_FILE" >> $GITHUB_OUTPUT

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lampuntu-24.04-ISO
          path: ${{ steps.find_iso.outputs.iso_path }}
          retention-days: 7
